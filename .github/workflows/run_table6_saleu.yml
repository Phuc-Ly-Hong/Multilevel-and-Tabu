name: Table 6 - Tabu Multi-Level tren Saleu 2022

# Chay khi push file nay / code ML_table6 len Method_B, hoac bam "Run workflow" trong tab Actions.
on:
  push:
    branches: [Method_B]
    paths:
      - '.github/workflows/run_table6_saleu.yml'
      - 'src/ML_table6_saleu_and_motiel.cpp'
  workflow_dispatch:

permissions:
  contents: write   # de job summarize commit + push ket qua len repo
  actions: read

concurrency:
  group: table6-saleu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    name: Compile ML_table6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile executable
        run: |
          g++ -O3 -std=c++17 -o ml_table6 src/ML_table6_saleu_and_motiel.cpp
          chmod +x ml_table6

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: table6-executable
          path: ml_table6
          retention-days: 7

  run:
    name: ${{ matrix.instance }} run${{ matrix.run_id }}
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        instance: [
          "CMT1", "CMT2", "CMT3", "CMT4", "CMT5",
          "E-n51-k5", "E-n76-k8", "E-n101-k8",
          "M-n151-k12", "M-n200-k16",
          "P-n51-k10", "P-n55-k7", "P-n60-k10", "P-n65-k10", "P-n70-k10", "P-n76-k5", "P-n101-k4",
          "X-n110-k13", "X-n115-k10", "X-n139-k10"
        ]
        run_id: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: table6-executable

      - name: Run algorithm (seed = run_id)
        run: |
          chmod +x ml_table6
          LOG="${{ matrix.instance }}_run${{ matrix.run_id }}.txt"
          echo "=== ${{ matrix.instance }} run ${{ matrix.run_id }}/3 (seed ${{ matrix.run_id }}) ==="

          set +e
          timeout 350m ./ml_table6 "instances/saleu-2022/${{ matrix.instance }}.vrp" \
            --seed ${{ matrix.run_id }} > "$LOG" 2>&1
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "EXIT_CODE $EXIT_CODE" >> "$LOG"
          fi
          cat "$LOG"

      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: table6-log-${{ matrix.instance }}-run${{ matrix.run_id }}
          path: ${{ matrix.instance }}_run${{ matrix.run_id }}.txt
          retention-days: 30

  summarize:
    name: Table 6 CSV + push
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all logs
        uses: actions/download-artifact@v4
        with:
          pattern: table6-log-*
          path: results/saleu-2022/logs
          merge-multiple: true

      - name: Build CSV
        run: |
          python3 <<'EOF'
          import csv, re, statistics
          from pathlib import Path

          # Best Ref = min(Saleu BC, Saleu HM, Montemanni MT-3IDX_UB, MT-2IDX_UB), thu tu nhu Bang 6.
          BEST_REF = {
              "CMT1": 166.00, "CMT2": 130.23, "CMT3": 184.00, "CMT4": 160.38, "CMT5": 138.00,
              "E-n101-k8": 184.00, "E-n51-k5": 166.00, "E-n76-k8": 154.00,
              "M-n151-k12": 154.00, "M-n200-k16": 144.00,
              "P-n101-k4": 340.00, "P-n51-k10": 111.07, "P-n55-k7": 126.00, "P-n60-k10": 114.00,
              "P-n65-k10": 126.00, "P-n70-k10": 128.00, "P-n76-k5": 200.00,
              "X-n110-k13": 1864.00, "X-n115-k10": 2258.00, "X-n139-k10": 2492.00,
          }
          RUNS = 3

          LOG_NAME_RE = re.compile(r"^(.+)_run(\d+)\.txt$")
          HEADER_RE = re.compile(r"^Instance\s+\S+:\s+(\d+) customers,\s+(\d+) trucks,\s+(\d+) drones", re.M)
          VEHICLE_RE = re.compile(r"^(Truck|Drone)\s+(\d+):\s*(.*?)\s*\(time\s+([^)]+)\)\s*$", re.M)
          RESULT_RE = re.compile(r"^RESULT\s+\S+\s+(\S+)\s+(\S+)", re.M)
          EXIT_RE = re.compile(r"^EXIT_CODE\s+(\d+)", re.M)

          log_dir = Path("results/saleu-2022/logs")
          out_dir = Path("results/saleu-2022")

          def write_csv(path, rows):
              with path.open("w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=list(rows[0]))
                  w.writeheader()
                  w.writerows(rows)

          # ---- 1 dong / 1 lan chay, kem loi giai chi tiet ----
          runs, routes = [], []
          for name in BEST_REF:
              for k in range(1, RUNS + 1):
                  path = log_dir / f"{name}_run{k}.txt"
                  row = {"Instance": name, "Run": k, "Seed": k, "Customers": "", "Trucks": "",
                         "Drones": "", "Makespan": "", "Time(s)": "", "Status": "", "Solution": ""}
                  if not path.exists():
                      row["Status"] = "MISSING"
                      runs.append(row)
                      continue
                  text = path.read_text(encoding="utf-8", errors="ignore")

                  h = HEADER_RE.search(text)
                  if h:
                      row.update(Customers=h.group(1), Trucks=h.group(2), Drones=h.group(3))

                  vehicles = VEHICLE_RE.findall(text)
                  for kind, vid, nodes, t in vehicles:
                      routes.append({"Instance": name, "Run": k, "Vehicle": vid, "Type": kind,
                                     "Route": nodes, "RouteTime": t.strip()})
                  row["Solution"] = " | ".join(f"{kind} {vid}: {nodes} (time {t.strip()})"
                                               for kind, vid, nodes, t in vehicles)

                  res, ex = RESULT_RE.search(text), EXIT_RE.search(text)
                  if res:
                      row.update({"Makespan": f"{float(res.group(1)):.2f}",
                                  "Time(s)": f"{float(res.group(2)):.3f}", "Status": "OK"})
                  elif ex and ex.group(1) == "124":
                      row["Status"] = "TIMEOUT"
                  else:
                      row["Status"] = f"ERROR(exit {ex.group(1)})" if ex else "ERROR"
                  runs.append(row)

          # ---- Bang 6: Best / Mean / STD / Time / BestRef / Gap ----
          summary = []
          for name, ref in BEST_REF.items():
              ok = [r for r in runs if r["Instance"] == name and r["Status"] == "OK"]
              vals = [float(r["Makespan"]) for r in ok]
              times = [float(r["Time(s)"]) for r in ok]
              row = {"Instance": name, "Best": "", "Mean": "", "STD": "", "Time(s)": "",
                     "BestRef": f"{ref:.2f}", "Gap(%)": "", "RunsOK": f"{len(ok)}/{RUNS}"}
              if ok:
                  best = min(vals)
                  row.update({"Best": f"{best:.2f}",
                              "Mean": f"{statistics.mean(vals):.2f}",
                              "STD": f"{statistics.stdev(vals):.2f}" if len(vals) > 1 else "0.00",
                              "Time(s)": f"{statistics.mean(times):.2f}",
                              "Gap(%)": f"{100.0 * (best - ref) / ref:.2f}"})
              summary.append(row)

          write_csv(out_dir / "table6_runs.csv", runs)
          if routes:
              write_csv(out_dir / "table6_routes.csv", routes)
          write_csv(out_dir / "table6_summary.csv", summary)

          print(f"{'Instance':12s} {'Best':>9s} {'Mean':>9s} {'STD':>7s} {'Time(s)':>8s} {'BestRef':>9s} {'Gap(%)':>7s} {'OK':>4s}")
          for r in summary:
              print(f"{r['Instance']:12s} {r['Best']:>9s} {r['Mean']:>9s} {r['STD']:>7s} "
                    f"{r['Time(s)']:>8s} {r['BestRef']:>9s} {r['Gap(%)']:>7s} {r['RunsOK']:>4s}")
          for r in runs:
              if r["Status"] != "OK":
                  print(f"!! {r['Instance']} run{r['Run']}: {r['Status']}")
          EOF

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: table6-saleu-results
          path: results/saleu-2022
          retention-days: 30

      - name: Commit and push results
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/saleu-2022
          if git diff --cached --quiet; then
            echo "Khong co thay doi de commit"
            exit 0
          fi
          git commit -m "Ket qua Bang 6 (Saleu 2022): 20 instance x 3 lan chay [run ${GITHUB_RUN_ID}]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            echo "Push loi, thu lai lan $i..."
            sleep $((i * 5))
          done
          exit 1
